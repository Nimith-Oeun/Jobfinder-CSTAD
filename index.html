<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- SEO Meta Tags -->
    <title>JobFinder Cambodia - Find Your Dream Job | Top Employment Platform</title>
    <meta name="description" content="Discover thousands of job opportunities in Cambodia with JobFinder. Connect with top employers, browse 50K+ active jobs, and advance your career with our AI-powered job matching platform." />
    <meta name="keywords" content="jobs Cambodia, employment Cambodia, career opportunities, job search, hiring, recruitment, work in Cambodia, job portal, career development" />
    <meta name="author" content="JobFinder Cambodia" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    
    <!-- Viewport and Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jobfinder-cambodia.com/" />
    <meta property="og:title" content="JobFinder Cambodia - Find Your Dream Job" />
    <meta property="og:description" content="Discover thousands of job opportunities in Cambodia. Connect with top employers and advance your career with our AI-powered job matching platform." />
    <meta property="og:image" content="/src/assets/Header.png" />
    <meta property="og:site_name" content="JobFinder Cambodia" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://jobfinder-cambodia.com/" />
    <meta property="twitter:title" content="JobFinder Cambodia - Find Your Dream Job" />
    <meta property="twitter:description" content="Discover thousands of job opportunities in Cambodia. Connect with top employers and advance your career." />
    <meta property="twitter:image" content="/src/assets/Header.png" />
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <link rel="apple-touch-icon" href="/src/assets/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://jobfinder-cambodia.com/" />
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Structured Data - JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "JobFinder Cambodia",
      "url": "https://jobfinder-cambodia.com/",
      "logo": "https://jobfinder-cambodia.com/src/assets/logo.png",
      "description": "Leading job portal in Cambodia connecting job seekers with top employers",
      "sameAs": [
        "https://facebook.com/jobfinder-cambodia",
        "https://linkedin.com/company/jobfinder-cambodia"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+855-XX-XXX-XXX",
        "contactType": "customer service",
        "availableLanguage": ["English", "Khmer"]
      }
    }
    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "JobFinder Cambodia",
      "url": "https://jobfinder-cambodia.com/",
      "description": "Find your dream job in Cambodia with our comprehensive job search platform",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://jobfinder-cambodia.com/jobs?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
